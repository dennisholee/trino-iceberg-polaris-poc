<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="When to use each option">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">When to use what</text>

  <rect x="300" y="56" width="300" height="52" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="2"/>
  <text x="450" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">What is the role of the data source?</text>

  <g stroke="#5f6368" stroke-width="1.5" fill="none">
    <path d="M450,108 L450,128 L120,128 L120,160" marker-end="url(#arrow)"/>
    <path d="M450,108 L450,128 L335,128 L335,160" marker-end="url(#arrow)"/>
    <path d="M450,108 L450,128 L565,128 L565,160" marker-end="url(#arrow)"/>
    <path d="M450,108 L450,128 L780,128 L780,160" marker-end="url(#arrow)"/>
  </g>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="162" width="180" height="150" rx="10" fill="#f1f3f4" stroke="#9aa0a6"/>
    <text x="120" y="192" fill="#3c4043">Local dev /</text>
    <text x="120" y="210" fill="#3c4043">modelling</text>
    <text x="120" y="266" font-weight="700" fill="#3c4043">→ DuckDB</text>

    <rect x="245" y="162" width="180" height="150" rx="10" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="335" y="192" fill="#174ea6">Leaving a closed</text>
    <text x="335" y="210" fill="#174ea6">warehouse</text>
    <text x="335" y="258" font-weight="700" fill="#174ea6">→ BigQuery</text>
    <text x="335" y="278" fill="#5f6368">migrate out</text>

    <rect x="475" y="162" width="180" height="150" rx="10" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="565" y="192" fill="#8a5a00">Raw files landing</text>
    <text x="565" y="210" fill="#8a5a00">on your bucket</text>
    <text x="565" y="252" font-weight="700" fill="#8a5a00">→ Blob +</text>
    <text x="565" y="270" font-weight="700" fill="#8a5a00">Schema Registry</text>
    <text x="565" y="290" fill="#5f6368">then Iceberg</text>

    <rect x="690" y="162" width="180" height="150" rx="10" fill="#e6f4ea" stroke="#34a853"/>
    <text x="780" y="192" fill="#1e7e34">System of record,</text>
    <text x="780" y="210" fill="#1e7e34">multi-engine, ACID</text>
    <text x="780" y="252" font-weight="700" fill="#1e7e34">→ Iceberg +</text>
    <text x="780" y="270" font-weight="700" fill="#1e7e34">Polaris</text>
  </g>
</svg>
