<svg viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Use case A: local development and data modelling with DuckDB">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="700" fill="#202124">UC-A · Local development &amp; data modelling</text>

  <rect x="40" y="70" width="430" height="170" rx="12" fill="#f8f9fa" stroke="#9aa0a6" stroke-dasharray="4 4"/>
  <text x="60" y="96" font-size="11" fill="#5f6368">Developer workstation (single node)</text>

  <rect x="70" y="120" width="150" height="60" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="145" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#174ea6">Trino</text>

  <rect x="290" y="120" width="150" height="60" rx="10" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
  <text x="365" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#3c4043">DuckDB</text>

  <line x1="220" y1="150" x2="288" y2="150" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="254" y="140" text-anchor="middle" font-size="10" fill="#5f6368">JDBC</text>
  <text x="365" y="205" text-anchor="middle" font-size="10" fill="#5f6368">.duckdb file</text>

  <rect x="600" y="120" width="220" height="60" rx="10" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="710" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a00">Object storage</text>
  <text x="710" y="164" text-anchor="middle" font-size="10" fill="#5f6368">optional Parquet read</text>
  <line x1="445" y1="150" x2="598" y2="150" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="40" y="288" font-size="11" fill="#5f6368">Fast iteration. Single writer, no shared storage — a dev tool, not the system of record.</text>
</svg>
