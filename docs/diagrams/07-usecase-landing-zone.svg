<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Use case C: lakehouse landing zone, metadata-only migration">
  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34a853"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="700" fill="#202124">UC-C · Lakehouse landing zone</text>

  <rect x="50" y="64" width="800" height="180" rx="14" fill="#f8f9fa" stroke="#9aa0a6" stroke-dasharray="4 4"/>
  <text x="70" y="90" font-size="12" font-weight="600" fill="#5f6368">Your object storage (one bucket)</text>

  <rect x="90" y="120" width="230" height="92" rx="10" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="205" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a00">raw files</text>
  <text x="205" y="172" text-anchor="middle" font-size="10" fill="#5f6368">Parquet / CSV / JSON</text>
  <text x="205" y="192" text-anchor="middle" font-size="10" fill="#5f6368">+ schema registry</text>

  <line x1="330" y1="166" x2="520" y2="166" stroke="#34a853" stroke-width="3" marker-end="url(#green)"/>
  <text x="425" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#1e7e34">register_table / migrate</text>
  <text x="425" y="190" text-anchor="middle" font-size="10" fill="#5f6368">metadata only</text>

  <rect x="530" y="112" width="290" height="108" rx="10" fill="#e6f4ea" stroke="#34a853"/>
  <text x="675" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#1e7e34">Iceberg table</text>
  <text x="675" y="166" text-anchor="middle" font-size="10" fill="#5f6368">metadata + manifests</text>
  <text x="675" y="184" text-anchor="middle" font-size="10" fill="#5f6368">over the SAME files</text>
  <text x="675" y="204" text-anchor="middle" font-size="10" fill="#5f6368">(no rewrite)</text>

  <rect x="350" y="282" width="200" height="40" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="2"/>
  <text x="450" y="307" text-anchor="middle" font-size="12" font-weight="600" fill="#202124">Trino</text>
  <line x1="675" y1="220" x2="500" y2="280" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
