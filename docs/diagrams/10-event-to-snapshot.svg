<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Event log folded into an aggregate snapshot">
  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34a853"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="700" fill="#202124">Events → aggregate snapshot</text>

  <rect x="40" y="70" width="330" height="220" rx="12" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="60" y="96" font-size="12" font-weight="700" fill="#8a5a00">Event log (immutable)</text>
  <g font-size="11" fill="#202124">
    <rect x="60" y="112" width="290" height="30" rx="6" fill="#ffffff" stroke="#f9ab00"/>
    <text x="74" y="132">evt_01 · agg=A · seq=1 · Created</text>
    <rect x="60" y="148" width="290" height="30" rx="6" fill="#ffffff" stroke="#f9ab00"/>
    <text x="74" y="168">evt_02 · agg=A · seq=2 · ItemAdded</text>
    <rect x="60" y="184" width="290" height="30" rx="6" fill="#ffffff" stroke="#f9ab00"/>
    <text x="74" y="204">evt_03 · agg=A · seq=3 · Paid</text>
    <rect x="60" y="220" width="290" height="30" rx="6" fill="#ffffff" stroke="#f9ab00"/>
    <text x="74" y="240">evt_04 · agg=B · seq=1 · Created</text>
  </g>
  <text x="60" y="272" font-size="10" fill="#5f6368">stable envelope + payload (mapped from event schema)</text>

  <line x1="370" y1="180" x2="518" y2="180" stroke="#34a853" stroke-width="3" marker-end="url(#green)"/>
  <text x="444" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#1e7e34">fold by seq</text>
  <text x="444" y="200" text-anchor="middle" font-size="10" fill="#5f6368">seq &gt; version</text>
  <text x="444" y="216" text-anchor="middle" font-size="10" fill="#5f6368">idempotent</text>

  <rect x="520" y="70" width="340" height="220" rx="12" fill="#e6f4ea" stroke="#34a853"/>
  <text x="540" y="96" font-size="12" font-weight="700" fill="#1e7e34">Aggregate snapshot (current state)</text>
  <rect x="540" y="112" width="300" height="30" rx="6" fill="#ffffff" stroke="#34a853"/>
  <text x="552" y="132" font-size="10" font-weight="700" fill="#202124">aggregate_id | version | state | watermark_at</text>
  <rect x="540" y="148" width="300" height="30" rx="6" fill="#ffffff" stroke="#34a853"/>
  <text x="552" y="168" font-size="10" fill="#202124">A | 3 | Paid | 2026-10-10T12:00Z</text>
  <rect x="540" y="184" width="300" height="30" rx="6" fill="#ffffff" stroke="#34a853"/>
  <text x="552" y="204" font-size="10" fill="#202124">B | 1 | Created | 2026-10-10T12:00Z</text>
  <text x="540" y="248" font-size="10" fill="#5f6368">monotonic version guard rejects stale/out-of-order events</text>
  <text x="540" y="266" font-size="10" fill="#5f6368">always rebuildable from the event log</text>
</svg>
