<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Sequence: aggregate retrieval by correlation id through the query engine">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#202124"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="40" y="30" font-size="15" font-weight="700" fill="#202124">seq-04 · Aggregate retrieval by correlation id</text>

  <g text-anchor="middle">
    <rect x="55" y="42" width="130" height="64" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
    <text x="120" y="58" font-size="9" font-style="italic" fill="#5f6368">«actor»</text>
    <text x="120" y="77" font-size="12" font-weight="600" fill="#3c4043">Client</text>
    <text x="120" y="93" font-size="9" fill="#5f6368">CLI · BI tool</text>

    <rect x="265" y="42" width="130" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="330" y="58" font-size="9" font-style="italic" fill="#5f6368">«query engine»</text>
    <text x="330" y="77" font-size="12" font-weight="600" fill="#174ea6">Trino</text>
    <text x="330" y="93" font-size="9" fill="#5f6368">Iceberg connector</text>

    <rect x="475" y="42" width="130" height="64" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
    <text x="540" y="58" font-size="9" font-style="italic" fill="#5f6368">«catalog»</text>
    <text x="540" y="77" font-size="12" font-weight="600" fill="#1e7e34">Polaris</text>
    <text x="540" y="93" font-size="9" fill="#5f6368">Iceberg REST</text>

    <rect x="685" y="42" width="130" height="64" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="750" y="58" font-size="9" font-style="italic" fill="#5f6368">«object store»</text>
    <text x="750" y="77" font-size="12" font-weight="600" fill="#8a5a00">MinIO</text>
    <text x="750" y="93" font-size="9" fill="#5f6368">S3 API</text>
  </g>

  <g stroke="#9aa0a6" stroke-width="1" stroke-dasharray="4 4">
    <line x1="120" y1="106" x2="120" y2="470"/>
    <line x1="330" y1="106" x2="330" y2="470"/>
    <line x1="540" y1="106" x2="540" y2="470"/>
    <line x1="750" y1="106" x2="750" y2="470"/>
  </g>

  <g stroke="#202124" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="150" x2="328" y2="150"/>
    <line x1="330" y1="192" x2="538" y2="192"/>
    <line x1="540" y1="234" x2="332" y2="234"/>
    <line x1="330" y1="276" x2="748" y2="276"/>
    <line x1="330" y1="320" x2="748" y2="320"/>
    <line x1="750" y1="364" x2="332" y2="364"/>
    <line x1="330" y1="412" x2="122" y2="412"/>
  </g>

  <g font-size="11" fill="#202124">
    <text x="132" y="142">1 · SELECT … WHERE correlation_id = 'txn-456'</text>
    <text x="340" y="184">2 · load table metadata</text>
    <text x="340" y="226" text-anchor="end">3 · current snapshot + manifest list</text>
    <text x="340" y="268">4 · read manifests (prune by partition)</text>
    <text x="340" y="312">5 · read Parquet (projection)</text>
    <text x="340" y="356" text-anchor="end">6 · rows</text>
    <text x="132" y="404" text-anchor="end">7 · aggregate result</text>
  </g>

  <rect x="55" y="436" width="800" height="60" rx="10" fill="#f8f9fa" stroke="#9aa0a6" stroke-dasharray="4 4"/>
  <text x="72" y="460" font-size="11" fill="#202124">No full scan: the manifest list + partition pruning skip irrelevant files.</text>
  <text x="72" y="480" font-size="11" fill="#5f6368">The same query shape serves both modes — on-read over events, or the materialised snapshot_order.</text>
</svg>
