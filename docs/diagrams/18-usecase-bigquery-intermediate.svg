<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Use case G: BigQuery staging tier feeding Iceberg served by Trino">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34a853"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="700" fill="#202124">UC-G · BigQuery staging tier</text>

  <g text-anchor="middle">
    <rect x="30" y="110" width="120" height="76" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="90" y="142" font-size="12" font-weight="600" fill="#174ea6">Event Hub</text>
    <text x="90" y="160" font-size="10" fill="#5f6368">Kafka · REST</text>

    <rect x="170" y="110" width="100" height="76" rx="10" fill="#f1f3f4" stroke="#9aa0a6"/>
    <text x="220" y="152" font-size="12" font-weight="600" fill="#3c4043">Kafka</text>

    <rect x="290" y="110" width="170" height="76" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="375" y="140" font-size="12" font-weight="600" fill="#174ea6">BigQuery staging</text>
    <text x="375" y="158" font-size="10" fill="#5f6368">absorb + SQL staging</text>
    <text x="375" y="174" font-size="10" fill="#5f6368">durable log</text>

    <rect x="560" y="110" width="150" height="76" rx="10" fill="#e6f4ea" stroke="#34a853"/>
    <text x="635" y="140" font-size="12" font-weight="600" fill="#1e7e34">Iceberg serving</text>
    <text x="635" y="158" font-size="10" fill="#5f6368">snapshot (gold)</text>

    <rect x="740" y="110" width="120" height="76" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="800" y="152" font-size="12" font-weight="600" fill="#174ea6">Trino</text>
  </g>

  <g stroke="#5f6368" stroke-width="1.5">
    <line x1="150" y1="148" x2="168" y2="148" marker-end="url(#arrow)"/>
    <line x1="270" y1="148" x2="288" y2="148" marker-end="url(#arrow)"/>
    <line x1="710" y1="148" x2="738" y2="148" marker-end="url(#arrow)"/>
  </g>
  <line x1="460" y1="148" x2="558" y2="148" stroke="#34a853" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="509" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#1e7e34">Trino is the bridge</text>
  <text x="509" y="170" text-anchor="middle" font-size="10" fill="#5f6368">INSERT…SELECT</text>

  <rect x="30" y="230" width="410" height="96" rx="12" fill="#e6f4ea" stroke="#34a853"/>
  <text x="50" y="256" font-size="12" font-weight="700" fill="#1e7e34">Why stage in BigQuery</text>
  <text x="50" y="280" font-size="11" fill="#5f6368">+ native streaming ingest · heavy SQL staging</text>
  <text x="50" y="300" font-size="11" fill="#5f6368">+ absorbs spikes · decouples ingest from serving</text>

  <rect x="460" y="230" width="410" height="96" rx="12" fill="#fce8e6" stroke="#d93025"/>
  <text x="480" y="256" font-size="12" font-weight="700" fill="#a50e0e">What it costs</text>
  <text x="480" y="280" font-size="11" fill="#5f6368">− an extra hop · a second system to run</text>
  <text x="480" y="300" font-size="11" fill="#5f6368">− schema translation BQ ↔ Iceberg</text>
</svg>
