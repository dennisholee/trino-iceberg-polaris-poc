<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Staleness budget: commit window plus metadata cache TTL">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="700" fill="#202124">Freshness: the staleness budget</text>

  <line x1="60" y1="150" x2="860" y2="150" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="10" fill="#202124" text-anchor="middle">
    <circle cx="110" cy="150" r="5" fill="#5f6368"/>
    <text x="110" y="128">event</text>
    <circle cx="215" cy="150" r="5" fill="#5f6368"/>
    <text x="215" y="128">Kafka</text>
    <circle cx="320" cy="150" r="5" fill="#5f6368"/>
    <text x="320" y="128">fold</text>
  </g>

  <rect x="345" y="132" width="180" height="36" rx="6" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="435" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#8a5a00">commit window</text>
  <text x="435" y="162" text-anchor="middle" font-size="10" fill="#5f6368">≤ commit interval</text>

  <polygon points="525,150 535,140 545,150 535,160" fill="#34a853"/>
  <text x="535" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#1e7e34">snapshot committed</text>

  <rect x="560" y="132" width="230" height="36" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="675" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#174ea6">metadata cache TTL</text>
  <text x="675" y="162" text-anchor="middle" font-size="10" fill="#5f6368">≈ 1 min default</text>

  <circle cx="800" cy="150" r="5" fill="#5f6368"/>
  <text x="800" y="128" text-anchor="middle" font-size="10" font-weight="600">query sees it</text>

  <line x1="320" y1="200" x2="800" y2="200" stroke="#202124" stroke-width="1.5"/>
  <line x1="320" y1="194" x2="320" y2="206" stroke="#202124" stroke-width="1.5"/>
  <line x1="800" y1="194" x2="800" y2="206" stroke="#202124" stroke-width="1.5"/>
  <text x="560" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#202124">staleness = commit window + cache TTL</text>

  <text x="40" y="276" font-size="11" fill="#5f6368">Readers are always consistent (lock-free snapshots) — just possibly behind.</text>
  <text x="40" y="296" font-size="11" fill="#5f6368">Tune two knobs: writer commit interval and Trino metadata cache TTL.</text>
</svg>
