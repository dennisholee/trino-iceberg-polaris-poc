# Reverse proxy in front of Polaris on host port 8181.
#
# The Gravitino Web UI sets a global Accept header of
# `application/vnd.gravitino.v1+json`. Polaris' OAuth token endpoint produces
# only `application/json`, so JAX-RS returns 406 Not Acceptable. Rewrite the
# header for that one endpoint and handle the browser's CORS exchange here.
#
# All other Polaris paths are proxied unchanged; in-cluster clients continue to
# use http://polaris:8181 directly.

server {
    listen 8080;
    server_name _;

    # Re-resolve Polaris through Docker's embedded DNS so a recreated Polaris
    # container (new IP) does not leave this proxy pointing at a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $polaris_upstream http://polaris:8181;

    # Match Polaris' quarkus.http.limits.max-body-size default (10 MB).
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/catalog/v1/oauth/tokens {
        # The UI runs on localhost:8090 and posts the token form cross-origin.
        add_header Access-Control-Allow-Origin "http://localhost:8090" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "accept,content-type,authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 600 always;

        # Polaris also emits CORS headers; hide them so the browser does not see
        # duplicate Access-Control-Allow-* values.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        proxy_set_header Accept "application/json";
        proxy_pass $polaris_upstream;
    }

    location / {
        proxy_pass $polaris_upstream;
    }
}
