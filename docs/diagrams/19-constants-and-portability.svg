<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="The invariant is the open contract; engines, catalogs and storage are swappable">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="40" y="32" font-size="16" font-weight="700" fill="#202124">The invariant is the contract — everything else swaps</text>

  <rect x="60" y="56" width="780" height="80" rx="12" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="80" y="78" font-size="11" font-weight="700" fill="#174ea6" letter-spacing="1">ENGINES · swappable</text>
  <g font-size="12" text-anchor="middle" fill="#202124">
    <rect x="74" y="88" width="180" height="34" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="164" y="110">Trino (default)</text>
    <rect x="266" y="88" width="180" height="34" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="356" y="110">Spark</text>
    <rect x="458" y="88" width="180" height="34" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="548" y="110">Flink</text>
    <rect x="650" y="88" width="180" height="34" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="740" y="110">DuckDB</text>
  </g>

  <line x1="450" y1="136" x2="450" y2="156" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="450" y1="236" x2="450" y2="256" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="450" y1="332" x2="450" y2="348" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="60" y="156" width="780" height="80" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="3"/>
  <text x="80" y="180" font-size="11" font-weight="700" fill="#1e7e34" letter-spacing="1">THE INVARIANT</text>
  <text x="80" y="212" font-size="15" font-weight="700" fill="#1e7e34">Iceberg table format · REST catalog contract</text>

  <rect x="60" y="256" width="780" height="76" rx="12" fill="#f1f3f4" stroke="#9aa0a6"/>
  <text x="80" y="278" font-size="11" font-weight="700" fill="#3c4043" letter-spacing="1">CATALOGS · swappable</text>
  <g font-size="11" text-anchor="middle" fill="#202124">
    <rect x="74" y="288" width="142" height="34" rx="8" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="145" y="310">Polaris (default)</text>
    <rect x="228" y="288" width="142" height="34" rx="8" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="299" y="310">Nessie</text>
    <rect x="382" y="288" width="142" height="34" rx="8" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="453" y="310">Glue</text>
    <rect x="536" y="288" width="142" height="34" rx="8" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="607" y="310">Unity</text>
    <rect x="690" y="288" width="142" height="34" rx="8" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="761" y="310">S3 Tables</text>
  </g>

  <rect x="60" y="348" width="780" height="76" rx="12" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="80" y="370" font-size="11" font-weight="700" fill="#8a5a00" letter-spacing="1">STORAGE · swappable</text>
  <g font-size="12" text-anchor="middle" fill="#202124">
    <rect x="74" y="380" width="180" height="34" rx="8" fill="#ffffff" stroke="#f9ab00"/>
    <text x="164" y="402">S3</text>
    <rect x="266" y="380" width="180" height="34" rx="8" fill="#ffffff" stroke="#f9ab00"/>
    <text x="356" y="402">GCS</text>
    <rect x="458" y="380" width="180" height="34" rx="8" fill="#ffffff" stroke="#f9ab00"/>
    <text x="548" y="402">Azure</text>
    <rect x="650" y="380" width="180" height="34" rx="8" fill="#ffffff" stroke="#f9ab00"/>
    <text x="740" y="402">MinIO</text>
  </g>
</svg>
