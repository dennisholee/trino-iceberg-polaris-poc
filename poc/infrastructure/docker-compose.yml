# POC scaffold — verify image tags and Polaris/Connect specifics for your environment.
# Scope: one vertical slice (Kafka -> Iceberg sink -> MinIO -> Polaris -> Trino).

services:
  kafka:
    profiles: ["data", "full"]
    image: apache/kafka:latest
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  minio:
    profiles: ["data", "full"]
    # MinIO's community images were removed from Docker Hub (2025).
    # Bitnami's legacy repository still publishes the same server — see docs/decisions.md (D12).
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  postgres:
    profiles: ["data", "full"]
    image: postgres:16
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB: polaris
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Polaris does not create its metastore schema; this runs on first init only.
      # POC v2 adds 02-gravitino-db.sql and the official Gravitino schema.
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U polaris -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 20

  polaris:
    profiles: ["data", "full"]
    image: apache/polaris:latest
    depends_on:
      - postgres
    ports:
      # Direct access for debugging; browser/tooling normally uses polaris-proxy on 8181.
      - "8182:8181"
    volumes:
      # NOTE: Polaris does not read /home/polaris/config/application.properties (verified: the
      # "metastore is intended for tests only" warning persisted). The metastore is therefore
      # configured through environment variables below — the mechanism the Polaris docs use.
      # `config/polaris/application.properties` holds the equivalent file for a non-Docker
      # (`java -jar`) deployment, where Quarkus does read config/application.properties.
      - ./config/polaris/application.properties:/deployments/polaris-config-reference.properties:ro
      # Without a stable signing key Polaris generates an ephemeral RSA key pair at every start,
      # which invalidates every token already issued (the Kafka sink hit exactly this:
      # NotAuthorizedException "Failed to verify the token" after a Polaris restart).
      - ./config/polaris/keys:/deployments/keys:ro
    environment:
      # --- metastore: relational JDBC on Postgres (the default in-memory backend is test-only) ---
      polaris.persistence.type: relational-jdbc
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/polaris?currentSchema=polaris_schema
      quarkus.datasource.username: polaris
      quarkus.datasource.password: polaris
      # --- stable token-broker signing keys (POC key pair, committed under config/polaris/keys) ---
      polaris.authentication.token-broker.rsa-key-pair.public-key-file: /deployments/keys/public_key.pem
      polaris.authentication.token-broker.rsa-key-pair.private-key-file: /deployments/keys/private_key.pem
      # Realm/principal bootstrap is done once with the Admin Tool (see README "Run order") and
      # persisted in Postgres. `polaris.bootstrap.credentials` must NOT be set here: Polaris logs
      # it as a security error ("Remove this security sensitive information...").
      # Polaris resolves storage credentials from the AWS default chain; MinIO uses static keys.
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
      # Gravitino UI (localhost:8090) exchanges client credentials at Polaris'
      # token endpoint from the browser. Allow that origin for the POC.
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:8090"
      QUARKUS_HTTP_CORS_METHODS: "GET,POST,OPTIONS"
      QUARKUS_HTTP_CORS_HEADERS: "content-type,authorization"

  polaris-proxy:
    profiles: ["data", "full"]
    image: nginx:1.27-alpine
    depends_on:
      - polaris
    ports:
      - "8181:8080"
    volumes:
      # The Gravitino UI sends its global Gravitino Accept header to the token
      # endpoint; Polaris produces only application/json and answers 406. This
      # proxy rewrites Accept for the token request and owns the browser CORS
      # response so the UI can exchange client credentials.
      - ./config/polaris/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  gravitino:
    profiles: ["full"]
    build:
      context: ./gravitino
      dockerfile: Dockerfile
    image: gravitino-poc:1.3.1
    depends_on:
      postgres:
        condition: service_healthy
      polaris:
        condition: service_started
      polaris-proxy:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8090:8090"
    volumes:
      # Gravitino reads conf/gravitino.conf (unlike Polaris, this mount is authoritative).
      - ./config/gravitino/gravitino.conf:/opt/gravitino/conf/gravitino.conf:ro
    environment:
      SKIP_CONFIG_REWRITE: "true"
      GRAVITINO_MEM: "-Xms512m -Xmx512m -XX:MaxMetaspaceSize=256m"
    healthcheck:
      # TCP check: /api/version may be behind the OAuth authenticator.
      test: ["CMD-SHELL", "python3 -c 'import socket; socket.create_connection((\"127.0.0.1\", 8090), 2)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  trino:
    profiles: ["data", "full"]
    image: trinodb/trino:latest
    depends_on:
      - polaris
      - minio
    ports:
      # host 8080 is commonly taken; Trino's published port is remapped to 8081
      - "8081:8080"
    volumes:
      - ./config/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties

  connect:
    profiles: ["data", "full"]
    build:
      context: ./connect          # custom image: Kafka Connect + Iceberg sink plugin + AWS SDK bundle
    image: iceberg-connect:local
    depends_on:
      - kafka
      - minio
      - polaris
    ports:
      - "8083:8083"
    environment:
      # Keep the Connect worker within the small-host budget; the default 2 GB heap
      # plus Trino/Kafka leaves no headroom on a 4 GB Docker VM.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m"
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: iceberg-sink
      CONNECT_CONFIG_STORAGE_TOPIC: connect-config
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/opt/kafka/plugins
      # The sink's S3FileIO resolves storage credentials from the AWS default chain.
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1

  gx-dq:
    profiles: ["full"]
    build:
      context: ../dq/gx-service
    image: gx-dq-service:local
    ports:
      - "8000:8000"
    volumes:
      - ../metadata/suites:/app/suites:ro
    environment:
      SUITES_DIR: /app/suites
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=2)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  operational-api:
    profiles: ["full"]
    build:
      context: ../operational-api
    image: operational-api:local
    depends_on:
      trino:
        condition: service_started
      gx-dq:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      TRINO_JDBC_URL: jdbc:trino://trino:8080/iceberg/poc
      TRINO_USER: poc
      TRINO_PASSWORD: ""
      DQ_GE_URL: http://gx-dq:8000

volumes:
  minio-data:
  pg-data:
