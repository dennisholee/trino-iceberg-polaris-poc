<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Decision matrix mapping requirements to recommended patterns">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="700" fill="#202124">Decision matrix: requirement → pattern</text>

  <rect x="40" y="70" width="250" height="40" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="60" y="95" font-size="12" font-weight="700" fill="#174ea6">Requirement</text>
  <rect x="290" y="70" width="270" height="40" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="310" y="95" font-size="12" font-weight="700" fill="#1e7e34">Recommended pattern</text>
  <rect x="560" y="70" width="300" height="40" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="580" y="95" font-size="12" font-weight="700" fill="#8a5a00">Why</text>

  <g font-size="11" fill="#202124">
    <rect x="40" y="118" width="820" height="48" fill="#f8f9fa"/>
    <rect x="40" y="166" width="820" height="48" fill="#ffffff"/>
    <rect x="40" y="214" width="820" height="48" fill="#f8f9fa"/>
    <rect x="40" y="262" width="820" height="48" fill="#ffffff"/>
    <rect x="40" y="310" width="820" height="48" fill="#f8f9fa"/>

    <text x="60" y="147" font-weight="600">Batch is acceptable (hours)</text>
    <text x="310" y="147">#3 + #4 · S2 Trino MERGE</text>
    <text x="580" y="147" fill="#5f6368">no new runtime · fully replayable</text>

    <text x="60" y="195" font-weight="600">Minutes matter</text>
    <text x="310" y="195">#4 · S1 streaming, or S4</text>
    <text x="580" y="195" fill="#5f6368">freshness vs runtime + compaction cost</text>

    <text x="60" y="243" font-weight="600">Sub-second point reads</text>
    <text x="310" y="243">#7 hot store beside #3 / #4</text>
    <text x="580" y="243" fill="#5f6368">Iceberg is not a lookup store</text>

    <text x="60" y="291" font-weight="600">Already on GCP · want managed</text>
    <text x="310" y="291">#5 / #6 · or stage via #4a</text>
    <text x="580" y="291" fill="#5f6368">native ingest · higher lock-in + cost</text>

    <text x="60" y="339" font-weight="600">Must avoid lock-in</text>
    <text x="310" y="339">#3 + #4 on your own bucket</text>
    <text x="580" y="339" fill="#5f6368">open files + REST catalog</text>
  </g>

  <text x="40" y="384" font-size="11" fill="#5f6368">Pick the pattern from the requirement that binds — not from tool preference.</text>
</svg>
