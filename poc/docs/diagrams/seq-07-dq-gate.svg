<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Sequence: DQ evidence from Great Expectations gates an operational API response">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#202124"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="40" y="30" font-size="15" font-weight="700" fill="#202124">seq-07 · DQ evidence and the API gate (POC v2)</text>

  <g text-anchor="middle">
    <rect x="15" y="42" width="95" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="62" y="58" font-size="8" font-style="italic" fill="#5f6368">«actor»</text>
    <text x="62" y="77" font-size="11" font-weight="600" fill="#174ea6">Client</text>
    <text x="62" y="93" font-size="8" fill="#5f6368">API caller</text>

    <rect x="115" y="42" width="95" height="64" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
    <text x="162" y="58" font-size="8" font-style="italic" fill="#5f6368">«api / PEP»</text>
    <text x="162" y="77" font-size="11" font-weight="600" fill="#a50e0e">Spring API</text>
    <text x="162" y="93" font-size="8" fill="#5f6368">operational</text>

    <rect x="215" y="42" width="95" height="64" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="262" y="58" font-size="8" font-style="italic" fill="#5f6368">«gate»</text>
    <text x="262" y="77" font-size="11" font-weight="600" fill="#8a5a00">ApiDqGate</text>
    <text x="262" y="93" font-size="8" fill="#5f6368">decision</text>

    <rect x="315" y="42" width="95" height="64" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
    <text x="362" y="58" font-size="8" font-style="italic" fill="#5f6368">«cache»</text>
    <text x="362" y="77" font-size="11" font-weight="600" fill="#3c4043">Status cache</text>
    <text x="362" y="93" font-size="8" fill="#5f6368">Caffeine</text>

    <rect x="415" y="42" width="95" height="64" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
    <text x="462" y="58" font-size="8" font-style="italic" fill="#5f6368">«metadata»</text>
    <text x="462" y="77" font-size="10" font-weight="600" fill="#1e7e34">Gravitino +</text>
    <text x="462" y="91" font-size="10" font-weight="600" fill="#1e7e34">OpenAPI</text>

    <rect x="515" y="42" width="95" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="562" y="58" font-size="8" font-style="italic" fill="#5f6368">«query engine»</text>
    <text x="562" y="77" font-size="11" font-weight="600" fill="#174ea6">Trino</text>
    <text x="562" y="93" font-size="8" fill="#5f6368">snapshot</text>

    <rect x="615" y="42" width="95" height="64" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
    <text x="662" y="58" font-size="8" font-style="italic" fill="#5f6368">«transport»</text>
    <text x="662" y="77" font-size="11" font-weight="600" fill="#3c4043">Kafka</text>
    <text x="662" y="93" font-size="8" fill="#5f6368">samples/results</text>

    <rect x="715" y="42" width="95" height="64" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
    <text x="762" y="58" font-size="8" font-style="italic" fill="#5f6368">«dq engine»</text>
    <text x="762" y="77" font-size="11" font-weight="600" fill="#1e7e34">GE service</text>
    <text x="762" y="93" font-size="8" fill="#5f6368">Python</text>

    <rect x="815" y="42" width="75" height="64" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="852" y="58" font-size="8" font-style="italic" fill="#5f6368">«evidence»</text>
    <text x="852" y="77" font-size="10" font-weight="600" fill="#8a5a00">dq_results</text>
    <text x="852" y="91" font-size="8" fill="#5f6368">Iceberg</text>
  </g>

  <g stroke="#9aa0a6" stroke-width="1" stroke-dasharray="4 4">
    <line x1="62" y1="106" x2="62" y2="560"/>
    <line x1="162" y1="106" x2="162" y2="560"/>
    <line x1="262" y1="106" x2="262" y2="560"/>
    <line x1="362" y1="106" x2="362" y2="560"/>
    <line x1="462" y1="106" x2="462" y2="560"/>
    <line x1="562" y1="106" x2="562" y2="560"/>
    <line x1="662" y1="106" x2="662" y2="560"/>
    <line x1="762" y1="106" x2="762" y2="560"/>
    <line x1="852" y1="106" x2="852" y2="560"/>
  </g>

  <g stroke="#202124" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="62" y1="150" x2="160" y2="150"/>
    <line x1="162" y1="190" x2="260" y2="190"/>
    <line x1="262" y1="230" x2="360" y2="230"/>
    <line x1="262" y1="270" x2="460" y2="270"/>
    <line x1="162" y1="310" x2="560" y2="310"/>
    <line x1="162" y1="350" x2="660" y2="350"/>
    <line x1="662" y1="390" x2="760" y2="390"/>
    <line x1="762" y1="430" x2="850" y2="430"/>
    <line x1="852" y1="470" x2="362" y2="470"/>
    <line x1="162" y1="510" x2="62" y2="510"/>
  </g>

  <g font-size="10" fill="#202124">
    <text x="70" y="142">1 · GET /v1/orders/{id}</text>
    <text x="170" y="182">2 · evaluate(asset, contract)</text>
    <text x="270" y="222">3 · latest DQ status</text>
    <text x="270" y="262">4 · contract/policy (cache miss)</text>
    <text x="170" y="302">5 · query snapshot</text>
    <text x="170" y="342">6 · async sample (redacted)</text>
    <text x="670" y="382">7 · validate via GE</text>
    <text x="770" y="422">8 · results</text>
    <text x="700" y="462" text-anchor="end">9 · refresh cache</text>
    <text x="70" y="502">10 · 200 / warn / 503 + headers</text>
  </g>

  <rect x="40" y="540" width="820" height="60" rx="10" fill="#f8f9fa" stroke="#9aa0a6" stroke-dasharray="4 4"/>
  <text x="58" y="562" font-size="10" fill="#202124">Full GE is not on the hot path. The gate uses cached status; async samples refresh it. Sync GE is only for critical/low-QPS endpoints.</text>
  <text x="58" y="580" font-size="10" fill="#5f6368">Unknown/stale is not pass: critical endpoints fail closed; standard/low-risk follow the explicit policy (D23).</text>
</svg>

