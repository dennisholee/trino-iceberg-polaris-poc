<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Layered architecture: providers, landing, materialise, store, query">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">Layered architecture</text>

  <rect x="40" y="56" width="880" height="86" rx="12" fill="#f8f9fa" stroke="#9aa0a6"/>
  <text x="60" y="80" font-size="11" font-weight="700" fill="#5f6368" letter-spacing="1">PROVIDERS / ON-RAMPS</text>
  <g font-size="12" text-anchor="middle" fill="#202124">
    <rect x="60" y="90" width="195" height="42" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="157" y="116">Event Hub (Kafka · REST)</text>
    <rect x="275" y="90" width="195" height="42" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
    <text x="372" y="116">DuckDB</text>
    <rect x="490" y="90" width="195" height="42" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="587" y="116">BigQuery</text>
    <rect x="705" y="90" width="195" height="42" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="802" y="116">Files (+ Schema Registry)</text>
  </g>

  <g stroke="#5f6368" stroke-width="1.5">
    <line x1="480" y1="142" x2="480" y2="156" marker-end="url(#arrow)"/>
    <line x1="480" y1="244" x2="480" y2="258" marker-end="url(#arrow)"/>
    <line x1="480" y1="346" x2="480" y2="360" marker-end="url(#arrow)"/>
    <line x1="480" y1="448" x2="480" y2="462" marker-end="url(#arrow)"/>
  </g>

  <rect x="40" y="158" width="880" height="86" rx="12" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="60" y="182" font-size="11" font-weight="700" fill="#8a5a00" letter-spacing="1">LANDING — raw, immutable</text>
  <g font-size="12" text-anchor="middle" fill="#202124">
    <rect x="60" y="192" width="410" height="42" rx="8" fill="#ffffff" stroke="#f9ab00"/>
    <text x="265" y="218">Iceberg event log (bronze)</text>
    <rect x="490" y="192" width="410" height="42" rx="8" fill="#ffffff" stroke="#f9ab00"/>
    <text x="695" y="218">Raw Parquet on object storage</text>
  </g>

  <rect x="40" y="260" width="880" height="86" rx="12" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="60" y="284" font-size="11" font-weight="700" fill="#174ea6" letter-spacing="1">MATERIALISE — events → aggregate snapshots</text>
  <g font-size="12" text-anchor="middle" fill="#202124">
    <rect x="60" y="294" width="268" height="42" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="194" y="320">S2 batch MERGE (Trino)</text>
    <rect x="346" y="294" width="268" height="42" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="480" y="320">S1 streaming (Flink / Spark)</text>
    <rect x="632" y="294" width="268" height="42" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="766" y="320">S3 on-read (materialized views)</text>
  </g>

  <rect x="40" y="362" width="880" height="86" rx="12" fill="#e6f4ea" stroke="#34a853"/>
  <text x="60" y="386" font-size="11" font-weight="700" fill="#1e7e34" letter-spacing="1">STORE + CATALOG</text>
  <g font-size="12" text-anchor="middle" fill="#202124">
    <rect x="60" y="396" width="410" height="42" rx="8" fill="#ffffff" stroke="#34a853"/>
    <text x="265" y="422">Iceberg tables on object storage</text>
    <rect x="490" y="396" width="410" height="42" rx="8" fill="#ffffff" stroke="#34a853"/>
    <text x="695" y="422">Polaris — Iceberg REST catalog</text>
  </g>

  <rect x="40" y="464" width="880" height="86" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="480" y="504" font-size="14" font-weight="700" fill="#174ea6">TRINO — the constant</text>
    <text x="480" y="526" font-size="11" fill="#5f6368">federated joins across all catalogs</text>
  </g>
</svg>
