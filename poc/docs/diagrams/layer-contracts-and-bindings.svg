<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Contract-first layering: domain contract, capabilities, bindings, runtime">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#202124"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="40" y="32" font-size="16" font-weight="700" fill="#202124">Contracts &amp; bindings — layering by abstraction</text>

  <rect x="40" y="56" width="640" height="66" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="58" y="80" font-size="11" font-weight="700" fill="#1e7e34" letter-spacing="1">«contract» DOMAIN — the event contract</text>
  <text x="58" y="102" font-size="11" fill="#5f6368">event envelope · invariants (seq ordering · correlation vs aggregate identity)</text>

  <rect x="40" y="136" width="640" height="66" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="58" y="160" font-size="11" font-weight="700" fill="#8a5a00" letter-spacing="1">«capability» CAPABILITIES (ports)</text>
  <text x="58" y="182" font-size="11" fill="#5f6368">publish · store · catalog · query · fold</text>

  <rect x="40" y="216" width="640" height="66" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="58" y="240" font-size="11" font-weight="700" fill="#174ea6" letter-spacing="1">«binding» BINDINGS — configuration</text>
  <text x="58" y="262" font-size="11" fill="#5f6368">Kafka · Connect Iceberg sink · Polaris · Trino (connector JSON · properties · SQL)</text>

  <rect x="40" y="296" width="640" height="66" rx="12" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="2"/>
  <text x="58" y="320" font-size="11" font-weight="700" fill="#5f6368" letter-spacing="1">«runtime» RUNTIME</text>
  <text x="58" y="342" font-size="11" fill="#5f6368">Docker Compose · images · Kafka · MinIO · Polaris · Postgres</text>

  <rect x="700" y="56" width="160" height="306" rx="12" fill="#ffffff" stroke="#9aa0a6" stroke-dasharray="4 4"/>
  <text x="780" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#202124">stable core ↑</text>
  <text x="780" y="200" text-anchor="middle" font-size="10" fill="#5f6368">swappable via</text>
  <text x="780" y="216" text-anchor="middle" font-size="10" fill="#5f6368">open protocols</text>
  <text x="780" y="236" text-anchor="middle" font-size="10" fill="#5f6368">Iceberg REST · S3</text>
  <text x="780" y="252" text-anchor="middle" font-size="10" fill="#5f6368">SQL · Kafka</text>
  <text x="780" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#202124">configurable edge ↓</text>

  <text x="40" y="394" font-size="11" fill="#202124">Artefact-reference rule: an artefact may reference a contract, never another artefact's internals.</text>
  <text x="40" y="414" font-size="11" fill="#5f6368">No application code in this slice — the layers are contracts, configuration and SQL.</text>
</svg>
