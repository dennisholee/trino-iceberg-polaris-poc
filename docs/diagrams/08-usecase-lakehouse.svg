  <text x="196" y="164" font-size="10" fill="#5f6368">REST</text>
  <text x="468" y="160" font-size="10" fill="#5f6368">REST</text>
  <text x="648" y="164" font-size="10" fill="#5f6368">REST</text>

  <rect x="270" y="320" width="340" height="72" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="440" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a00">Iceberg files</text>
  <text x="440" y="370" text-anchor="middle" font-size="10" fill="#5f6368">S3 / GCS / MinIO — one copy</text>

  <line x1="440" y1="254" x2="440" y2="318" stroke="#34a853" stroke-width="2.5" marker-end="url(#green)"/>

  <text x="40" y="418" font-size="11" fill="#5f6368">Multiple engines, one copy of the data, catalog-level ACID and schema evolution.</text>
