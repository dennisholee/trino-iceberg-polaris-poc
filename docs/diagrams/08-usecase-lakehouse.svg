<svg viewBox="0 0 880 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Use case D: multi-engine open lakehouse">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34a853"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="700" fill="#202124">UC-D · Multi-engine open lakehouse</text>

  <rect x="70" y="70" width="150" height="52" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="145" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#174ea6">Trino</text>

  <rect x="365" y="70" width="150" height="52" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="2"/>
  <text x="440" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Spark</text>

  <rect x="660" y="70" width="150" height="52" rx="10" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
  <text x="735" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#3c4043">DuckDB</text>

  <rect x="315" y="190" width="250" height="64" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="440" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#1e7e34">Polaris</text>
  <text x="440" y="240" text-anchor="middle" font-size="10" fill="#5f6368">Iceberg REST catalog</text>

  <g stroke="#5f6368" stroke-width="1.5" fill="none">
    <line x1="145" y1="122" x2="330" y2="188" marker-end="url(#arrow)"/>
    <line x1="440" y1="122" x2="440" y2="188" marker-end="url(#arrow)"/>
    <line x1="735" y1="122" x2="550" y2="188" marker-end="url(#arrow)"/>
