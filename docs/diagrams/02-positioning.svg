<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Positioning of the four options by openness and table-format guarantees">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">Positioning: openness vs. table-format guarantees</text>

  <line x1="130" y1="450" x2="860" y2="450" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="130" y1="450" x2="130" y2="80" stroke="#9aa0a6" stroke-width="2"/>

  <text x="860" y="474" text-anchor="end" font-size="12" fill="#5f6368">Open / portable</text>
  <text x="130" y="474" text-anchor="start" font-size="12" fill="#5f6368">Proprietary / locked-in</text>

  <text x="122" y="92" text-anchor="end" font-size="12" fill="#5f6368">ACID · snapshots ·</text>
  <text x="122" y="108" text-anchor="end" font-size="12" fill="#5f6368">multi-engine</text>
  <text x="122" y="448" text-anchor="end" font-size="12" fill="#5f6368">none</text>

  <rect x="150" y="130" width="180" height="46" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="240" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#174ea6">BigQuery</text>
  <text x="240" y="196" text-anchor="middle" font-size="11" fill="#5f6368">closed storage</text>

  <rect x="205" y="280" width="200" height="46" rx="10" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
  <text x="305" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#3c4043">DuckDB</text>
  <text x="305" y="346" text-anchor="middle" font-size="11" fill="#5f6368">ACID, but embedded · single-node</text>

  <rect x="560" y="128" width="220" height="50" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="670" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1e7e34">Iceberg + Polaris</text>
  <text x="670" y="198" text-anchor="middle" font-size="11" fill="#5f6368">open · ACID · multi-engine</text>

  <rect x="545" y="350" width="250" height="46" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="670" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a00">Blob + Schema Registry</text>
  <text x="670" y="416" text-anchor="middle" font-size="11" fill="#5f6368">open, but no transactions</text>
</svg>
