<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Use case B: migrating off a closed warehouse to Iceberg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ab00"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="700" fill="#202124">UC-B · Migrate off a closed warehouse</text>

  <rect x="50" y="120" width="190" height="84" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="145" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#174ea6">BigQuery</text>
  <text x="145" y="178" text-anchor="middle" font-size="10" fill="#5f6368">closed storage</text>

  <line x1="240" y1="162" x2="420" y2="162" stroke="#f9ab00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#amber)"/>
  <text x="330" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#8a5a00">one-time copy</text>
  <text x="330" y="186" text-anchor="middle" font-size="10" fill="#5f6368">map types · partitions</text>

  <rect x="430" y="120" width="210" height="84" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="535" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#1e7e34">Iceberg</text>
  <text x="535" y="178" text-anchor="middle" font-size="10" fill="#5f6368">files on your bucket</text>

  <line x1="640" y1="162" x2="760" y2="162" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="765" y="130" width="120" height="64" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="2"/>
  <text x="825" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Trino</text>

  <text x="40" y="266" font-size="11" fill="#5f6368">The hard part is not the copy — it is type, partition and dialect translation.</text>
  <text x="40" y="288" font-size="11" fill="#5f6368">Alternative: BigQuery managed Iceberg (BigLake), or read our Iceberg via a BigQuery external table.</text>
</svg>
