# Gravitino server config for POC v2.
# The container is started with SKIP_CONFIG_REWRITE=true, so this file is authoritative.
# It is mounted read-only at /opt/gravitino/conf/gravitino.conf.

# --- web server -----------------------------------------------------------
gravitino.server.webserver.host = 0.0.0.0
gravitino.server.webserver.httpPort = 8090
gravitino.server.webserver.includeErrorStackTrace = false

# --- entity store: PostgreSQL (separate database/schema from Polaris) -----
gravitino.entity.store = relational
gravitino.entity.store.relational = JDBCBackend
gravitino.entity.store.relational.jdbcUrl = jdbc:postgresql://postgres:5432/gravitino?currentSchema=gravitino
gravitino.entity.store.relational.jdbcDriver = org.postgresql.Driver
gravitino.entity.store.relational.jdbcUser = polaris
gravitino.entity.store.relational.jdbcPassword = polaris

# --- POC security: OAuth token passthrough; authorization off; audit on ---
# Gravitino's REST-catalog backend forwards the caller's bearer token to Polaris.
# Polaris JWTs have no `aud` claim, so the POC uses a small validator that checks
# the Polaris RS256 signature + issuer. This is a spike shim, not production auth.
# Production should use an identity provider/token broker with audience-bound tokens
# and enable authorization (Ranger or the built-in model).
gravitino.authenticators = oauth
# The web UI obtains an OAuth token from this endpoint with the client-credentials
# form. The POC uses Polaris as the token issuer; the custom validator below
# validates the resulting Polaris JWT. Use localhost (not the Docker DNS name)
# because this URL is used by the browser.
gravitino.authenticator.oauth.provider = default
gravitino.authenticator.oauth.serverUri = http://localhost:8181
gravitino.authenticator.oauth.tokenPath = /api/catalog/v1/oauth/tokens
gravitino.authenticator.oauth.serviceAudience = GravitinoServer
gravitino.authenticator.oauth.tokenValidatorClass = poc.gravitino.auth.PolarisTokenValidator
gravitino.authenticator.oauth.signAlgorithmType = RS256
# Base64(DER) of config/polaris/keys/public_key.pem (POC public key; not a secret).
gravitino.authenticator.oauth.defaultSignKey = 

gravitino.authorization.enable = false
gravitino.audit.enabled = true

# The Iceberg REST auxiliary service is intentionally not enabled here. Polaris is
# the Iceberg catalog of record; Gravitino only federates its metadata.
