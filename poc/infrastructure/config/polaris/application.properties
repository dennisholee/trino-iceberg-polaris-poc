# Polaris catalog server — POC configuration
#
# Persistence: **relational JDBC on Postgres**. Polaris's default (`in-memory`) is test-only and
# loses every catalog, namespace, table and principal on restart — see
# docs/metastores/ (https://polaris.apache.org/releases/1.8.0/metastores/).
#
# Accepted values of `polaris.persistence.type`: `in-memory`, `relational-jdbc`, `nosql`.

polaris.features."ENABLE_CATALOG_FEDERATION"=false
polaris.realm-context.realms=POLARIS

# --- metastore: relational JDBC ---------------------------------------------------------------
polaris.persistence.type=relational-jdbc

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=polaris
quarkus.datasource.password=polaris

# `currentSchema` selects the schema Polaris reads and writes. It is set in the JDBC URL (which
# takes precedence over the shipped default) so that the server and the admin tool agree.
# Polaris does NOT create the schema — `postgres/init/01-polaris-schema.sql` does, and the
# bootstrap applies the table DDL on top of it.
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/polaris?currentSchema=polaris_schema

quarkus.http.port=8181

quarkus.http.port=8181
