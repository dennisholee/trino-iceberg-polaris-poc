<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Options for where the durable event log lives">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="700" fill="#202124">Bronze: where does the durable log live?</text>

  <g text-anchor="middle">
    <rect x="30" y="70" width="170" height="150" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
    <text x="115" y="102" font-size="12" font-weight="700" fill="#1e7e34">Iceberg event log</text>
    <text x="115" y="132" font-size="16">✅</text>
    <text x="115" y="164" font-size="10" fill="#5f6368">queryable · replay</text>
    <text x="115" y="180" font-size="10" fill="#5f6368">time travel</text>
    <text x="115" y="202" font-size="10" font-weight="600" fill="#1e7e34">default</text>

    <rect x="217" y="70" width="170" height="150" rx="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
    <text x="302" y="102" font-size="12" font-weight="700" fill="#3c4043">Kafka (tiered)</text>
    <text x="302" y="132" font-size="16">✅</text>
    <text x="302" y="164" font-size="10" fill="#5f6368">retention ≥</text>
    <text x="302" y="180" font-size="10" fill="#5f6368">replay horizon</text>
    <text x="302" y="202" font-size="10" font-weight="600" fill="#3c4043">Kappa</text>

    <rect x="404" y="70" width="170" height="150" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="489" y="102" font-size="12" font-weight="700" fill="#174ea6">BigQuery table</text>
    <text x="489" y="132" font-size="16">✅</text>
    <text x="489" y="164" font-size="10" fill="#5f6368">BQ is the log</text>
    <text x="489" y="180" font-size="10" fill="#5f6368">7-day time travel</text>
    <text x="489" y="202" font-size="10" font-weight="600" fill="#174ea6">staging tier</text>

    <rect x="591" y="70" width="170" height="150" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="676" y="102" font-size="12" font-weight="700" fill="#8a5a00">REST history</text>
    <text x="676" y="132" font-size="16">⚠️</text>
    <text x="676" y="164" font-size="10" fill="#5f6368">small / occasional</text>
    <text x="676" y="180" font-size="10" fill="#5f6368">replay only</text>
    <text x="676" y="202" font-size="10" font-weight="600" fill="#8a5a00">rate-limited</text>

    <rect x="778" y="70" width="170" height="150" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
    <text x="863" y="102" font-size="12" font-weight="700" fill="#a50e0e">Nowhere</text>
    <text x="863" y="132" font-size="16">❌</text>
    <text x="863" y="164" font-size="10" fill="#5f6368">no replay</text>
    <text x="863" y="180" font-size="10" fill="#5f6368">no correction</text>
    <text x="863" y="202" font-size="10" font-weight="600" fill="#a50e0e">avoid</text>
  </g>

  <rect x="30" y="250" width="918" height="96" rx="12" fill="#f8f9fa" stroke="#9aa0a6" stroke-dasharray="4 4"/>
  <text x="50" y="278" font-size="12" font-weight="700" fill="#202124">The coupling that matters</text>
  <text x="50" y="302" font-size="11" fill="#5f6368">The log is non-negotiable — only its location is a choice. Dropping the materialised bronze is safe only if another durable log exists.</text>
  <text x="50" y="324" font-size="11" fill="#5f6368">It breaks S2 (batch MERGE needs a queryable persisted log) and forces S1 streaming.</text>
</svg>
