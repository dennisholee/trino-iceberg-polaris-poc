<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Alternative architecture families grouped by build-buy, real-time and swap-the-parts">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="40" y="32" font-size="16" font-weight="700" fill="#202124">Alternative families</text>

  <rect x="40" y="62" width="820" height="76" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="58" y="92" font-size="11" font-weight="700" fill="#1e7e34" letter-spacing="1">BUY · the lakehouse</text>
  <text x="58" y="112" font-size="9" fill="#5f6368">managed Iceberg</text>
  <g font-size="10" text-anchor="middle" fill="#202124">
    <rect x="210" y="80" width="150" height="40" rx="8" fill="#ffffff" stroke="#34a853"/>
    <text x="285" y="105">AWS S3 Tables</text>
    <rect x="372" y="80" width="150" height="40" rx="8" fill="#ffffff" stroke="#34a853"/>
    <text x="447" y="105">Snowflake Open Catalog</text>
    <rect x="534" y="80" width="150" height="40" rx="8" fill="#ffffff" stroke="#34a853"/>
    <text x="609" y="105">Databricks Unity</text>
    <rect x="696" y="80" width="150" height="40" rx="8" fill="#ffffff" stroke="#34a853"/>
    <text x="771" y="105">BigQuery managed Iceberg</text>
  </g>

  <rect x="40" y="152" width="820" height="76" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="58" y="182" font-size="11" font-weight="700" fill="#8a5a00" letter-spacing="1">BUY · the hop</text>
  <text x="58" y="202" font-size="9" fill="#5f6368">managed Kafka → Iceberg</text>
  <g font-size="10" text-anchor="middle" fill="#202124">
    <rect x="210" y="170" width="204" height="40" rx="8" fill="#ffffff" stroke="#f9ab00"/>
    <text x="312" y="195">Confluent Tableflow</text>
    <rect x="426" y="170" width="204" height="40" rx="8" fill="#ffffff" stroke="#f9ab00"/>
    <text x="528" y="195">Redpanda Iceberg Topics</text>
    <rect x="642" y="170" width="204" height="40" rx="8" fill="#ffffff" stroke="#f9ab00"/>
    <text x="744" y="195">ClickHouse ClickPipes</text>
  </g>

  <rect x="40" y="242" width="820" height="76" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="58" y="272" font-size="11" font-weight="700" fill="#174ea6" letter-spacing="1">GO · real-time</text>
  <text x="58" y="292" font-size="9" fill="#5f6368">freshness / serving</text>
  <g font-size="10" text-anchor="middle" fill="#202124">
    <rect x="210" y="260" width="204" height="40" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="312" y="285">Paimon + Flink</text>
    <rect x="426" y="260" width="204" height="40" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="528" y="285">RisingWave / Materialize</text>
    <rect x="642" y="260" width="204" height="40" rx="8" fill="#ffffff" stroke="#1a73e8"/>
    <text x="744" y="285">ClickHouse / StarRocks</text>
  </g>

  <rect x="40" y="332" width="820" height="76" rx="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
  <text x="58" y="362" font-size="11" font-weight="700" fill="#3c4043" letter-spacing="1">SWAP · the parts</text>
  <text x="58" y="382" font-size="9" fill="#5f6368">format · catalog</text>
  <g font-size="10" text-anchor="middle" fill="#202124">
    <rect x="210" y="350" width="150" height="40" rx="8" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="285" y="375">Delta + UniForm</text>
    <rect x="372" y="350" width="150" height="40" rx="8" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="447" y="375">Apache Hudi</text>
    <rect x="534" y="350" width="150" height="40" rx="8" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="609" y="375">DuckLake</text>
    <rect x="696" y="350" width="150" height="40" rx="8" fill="#ffffff" stroke="#9aa0a6"/>
    <text x="771" y="375">Unity · Gravitino · Nessie</text>
  </g>

  <text x="40" y="440" font-size="11" fill="#202124">The format choice is settled (Iceberg). The live decisions are <tspan font-weight="600">managed vs self-hosted</tspan> and <tspan font-weight="600">batch fold vs real-time</tspan>.</text>
  <text x="40" y="462" font-size="11" fill="#5f6368">Every option above keeps the contract-first core: event envelope · fold semantics · Iceberg as the contract · catalog via REST.</text>
</svg>
