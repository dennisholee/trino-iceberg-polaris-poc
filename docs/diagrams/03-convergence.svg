<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Convergence of each source to Iceberg">
  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34a853"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ab00"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">Convergence: every source reaches Iceberg</text>

  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="50" y="90" width="230" height="58" rx="10" fill="#f1f3f4" stroke="#9aa0a6"/>
    <text x="165" y="125" fill="#3c4043">DuckDB</text>

    <rect x="50" y="180" width="230" height="58" rx="10" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="165" y="215" fill="#174ea6">BigQuery</text>

    <rect x="50" y="270" width="230" height="58" rx="10" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="165" y="305" fill="#8a5a00">Blob + Schema Registry</text>
  </g>

  <rect x="600" y="170" width="250" height="120" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="725" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1e7e34">Iceberg + Polaris</text>
  <text x="725" y="246" text-anchor="middle" font-size="11" fill="#5f6368">files on your bucket</text>

  <path d="M280,119 L598,200" fill="none" stroke="#f9ab00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#amber)"/>
  <path d="M280,209 L598,224" fill="none" stroke="#f9ab00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#amber)"/>
  <path d="M280,299 L598,250" fill="none" stroke="#34a853" stroke-width="3" marker-end="url(#green)"/>

  <text x="430" y="140" text-anchor="middle" font-size="11" fill="#8a5a00">copy (CTAS)</text>
  <text x="440" y="205" text-anchor="middle" font-size="11" fill="#8a5a00">export · copy</text>
  <text x="440" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#1e7e34">metadata only</text>

  <g font-size="11" fill="#5f6368">
    <line x1="60" y1="392" x2="100" y2="392" stroke="#34a853" stroke-width="3"/>
    <text x="110" y="396">files never move</text>
    <line x1="270" y1="392" x2="310" y2="392" stroke="#f9ab00" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="320" y="396">data is copied</text>
  </g>
</svg>
